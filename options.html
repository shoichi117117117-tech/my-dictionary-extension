<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lookup Extension Options</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; color: #1f2937; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0284c7; }
    #status { margin-top: 10px; font-size: 13px; color: #16a34a; }
  </style>
</head>
<body>
  <h2>Extension Settings</h2>
  <label for="apiKey">OpenRouter API Key</label>
  <input type="password" id="apiKey" placeholder="sk-or-v1-...">
  <button id="saveBtn">Save Key</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
