<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1f2937;
      background: #ffffff;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #1d4ed8;
      border-bottom-color: #1d4ed8;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Saved Words Tab */
    .word-list {
      max-height: 300px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .word-text { font-weight: 600; color: #111827; }
    .word-meta { font-size: 11px; color: #6b7280; }
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }
    .empty-state { text-align: center; color: #9ca3af; padding: 20px 0; }

    /* Settings Tab */
    .form-group { margin-bottom: 12px; }
    label { font-weight: 600; display: block; margin-bottom: 4px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    .save-settings-btn {
      width: 100%;
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" id="tabWords">📚 Saved Words</button>
    <button class="tab-btn" id="tabSettings">⚙️ Settings</button>
  </div>

  <!-- Words List View -->
  <div id="viewWords" class="tab-content active">
    <ul id="wordList" class="word-list"></ul>
    <div id="emptyState" class="empty-state">No saved words yet!</div>
  </div>

  <!-- Settings View -->
  <div id="viewSettings" class="tab-content">
    <div class="form-group">
      <label for="apiKey">OpenRouter API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
    </div>
    <button class="save-settings-btn" id="saveKeyBtn">Save API Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
